services:
  - type: web
    name: nubianfit-backend
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt && python backend/seed_data.py
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./nubianfit.db
