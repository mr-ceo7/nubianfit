<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#051b14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Glowing emblem group -->
  <g filter="url(#glow)">
    <!-- Central Hexagon / Shield -->
    <path d="M 256 100 L 390 176 L 390 336 L 256 412 L 122 336 L 122 176 Z" 
          fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Stylized Dumbbell / Athletic Motif -->
    <!-- Barbell central bar -->
    <line x1="180" y1="256" x2="332" y2="256" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Left Weight Plates -->
    <rect x="160" y="196" width="22" height="120" rx="11" fill="url(#accentGrad)"/>
    <rect x="134" y="216" width="18" height="80" rx="9" fill="url(#accentGrad)" opacity="0.85"/>
    
    <!-- Right Weight Plates -->
    <rect x="330" y="196" width="22" height="120" rx="11" fill="url(#accentGrad)"/>
    <rect x="360" y="216" width="18" height="80" rx="9" fill="url(#accentGrad)" opacity="0.85"/>

    <!-- Lightning / Dynamic Speed Notch -->
    <polygon points="256,170 236,250 266,250 246,340 286,240 256,240" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
